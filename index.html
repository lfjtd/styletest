  .btn { display: block; width: 100%; text-align: center;

    font-weight: 600; cursor: pointer; margin-top: 6px; font-family: inherit; }

  .sec .dont { color: #c0392b; }

  .box.bad { background: #fdf0ef; }

  .formula { background: linear-gradient(90deg,#fdf2f8,#f3e8ff); border-radius: 12px;

    <div class="field">

    </div>
    <div class="field">

  function chips(id, arr, multi) {
    const el = document.getElementById(id);
    arr.forEach(v => {
      const c = document.createElement('div');
      c.className = 'chip';
      c.textContent = v;
      c.onclick = () => {
        if (multi) {
          c.classList.toggle('on');
        } else {
          el.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
          c.classList.add('on');
        }
      };
      el.appendChild(c);
    });
  }
  chips('gender', DATA.gender, false);
  chips('face', DATA.face, false);
  chips('body', DATA.body, false);
  chips('leg', DATA.leg, false);
  chips('shoulder', DATA.shoulder, false);
  chips('skin', DATA.skin, false);
  chips('style', DATA.style, true);
  chips('scene', DATA.scene, true);

  function picked(id) {
    return [...document.getElementById(id).querySelectorAll('.chip.on')].map(c => c.textContent);
  }

  function go() {
    const gender = picked('gender')[0];
    const h = parseFloat(document.getElementById('height').value);
    const w = parseFloat(document.getElementById('weight').value);
    const face = picked('face')[0];
    const body = picked('body')[0];
    const leg = picked('leg')[0];
    const shoulder = picked('shoulder')[0];
    const skin = picked('skin')[0];
    const styles = picked('style');
    const scenes = picked('scene');

    if (!gender || !h || !w || !face || !body || !leg || !shoulder || !skin || !styles.length) {
      alert('请先选择性别，并填完身高体重，选择脸型、身型、腿型、肩型、肤色和至少一个风格方向');
      return;

    const la = isM ? LEG_ADVICE_M[leg] : LEG_ADVICE[leg];
    const sa = isM ? SHOULDER_ADVICE_M[shoulder] : SHOULDER_ADVICE[shoulder];

    const styleSrc = isM ? STYLE_DESC_M : STYLE_DESC;
    const main = styleSrc[styles[0]];
    const sub = styles.slice(1);
    const keywords = main.keywords;
    const looks = main.looks;

    const styleStar = main.star;
    const faceStar = isM ? FACE_STAR_M[face] : fa.star;

    const r = document.getElementById('result');
    r.classList.remove('hidden');

      <div class="r-head">

        <div class="r-tag">${bodyTypeLine(bmi)} · ${face} · ${skin}</div>

        <h3>📐 你的体型画像</h3>

        <h3>🎨 你的专属色系（${skin}）</h3>

      </div>

        <h3>👗 穿搭核心方案</h3>
        <p>风格方向：${styleTxt}</p>
        <p style="margin-top:8px"><b>主风格「${styles[0]}」</b>：${main.dress}</p>
        <p style="margin-top:4px">关键法则：${main.key}</p>

        <div class="locked-note">私信获取解锁码</div>

    `;
    // 把完整内容存到全局，解锁时填入
    window.__lockedHTML = lockedHTML;

  function tryUnlock() {
    const inp = document.getElementById('unlockInput');
    const area = document.getElementById('lockArea');
    if (!inp || !area) return;
    const v = inp.value.trim().toUpperCase();
    if (v === UNLOCK_CODE) {
      area.innerHTML = window.__lockedHTML || '';
      area.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else {
      alert('解锁码不正确，请检查后重试');
    }
  }

  function bodyTypeLine(bmi) {
    if (bmi < 18.5) return '纤细型';
    if (bmi < 24) return '标准型';
    if (bmi < 28) return '圆润型';
    return '丰满型';
  }
  function bodyAdvice(bmi, bodyTip) {
    const byBmi =
      bmi < 18.5 ? '偏瘦，需增加体量感避免单薄' :
      bmi < 24 ? '标准，可塑性最强' :
      bmi < 28 ? '偏丰满，注意扬长避短与平衡' :
      '丰满，重点营造轮廓感';
    return bodyTip + '；结合体重状态：' + byBmi + '。';
  }
  function goldenRatio(h) {
    // 按身高给衣长/裙长/裤长参考（单位 cm，供参考）
    const coat = Math.round(h * 0.49);   // 及胯上短外套
    const dress = Math.round(h * 0.55);  // 及膝裙长约
    const midi = Math.round(h * 0.72);   // 中长裙
    const long = Math.round(h * 0.92);   // 长裙/拖地裤
    const crop = Math.round(h * 0.42);   // 短上衣
    return `<div class="box good">
      <b>显高小贴士</b><br>
      短上衣/短外套约 ${crop}cm（及腰上）<br>
      及膝裙约 ${dress}cm · 中长裙约 ${midi}cm · 长裙/拖地裤约 ${long}cm<br>
      高腰线 + 露脚踝是通用显高公式
    </div>`;
  }
  function sceneAdvice(sc, bmi) {
    const fat = bmi >= 24;
    switch (sc) {
      case '通勤上班': return fat ? '高腰直筒裤+垂感V领衬衫，深色系最稳' : '利落衬衫+高腰西裤或半裙，质感优先';
      case '约会': return fat ? '收腰连衣裙+外搭开衫，V领显瘦' : '温柔系连衣裙或针织套装，扬长避短';
      case '日常休闲': return '基础款+高腰线，舒适与比例兼顾';
      case '逛街拍照': return '有轮廓感的单品+亮色点缀，上镜显气色';
      case '正式场合': return fat ? '挺括西装/收腰礼服，深色最稳' : '质感礼服或西装裙，剪裁决定气质';
    }
    return '';
  }
